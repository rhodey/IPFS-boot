name: Run

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: package/package-lock.json
      - name: Test js
        run: |
          npm --prefix package ci
          npm --prefix package test
      - uses: docker/setup-buildx-action@v3
      - name: Build js
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ipfs-boot
          cache-from: type=gha,scope=boot-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=boot-${{ matrix.arch }}
      - name: Export and check clean output
        run: |
          mkdir -p dist
          touch dist/obsolete.js dist/.obsolete
          docker run --rm --network=none -v ./dist:/root/dist ipfs-boot | tee cid.txt
          test ! -e dist/obsolete.js
          test ! -e dist/.obsolete
          docker run --rm --network=none -v ./dist-again:/root/dist ipfs-boot > cid-again.txt
          diff -r dist dist-again
          cmp cid.txt cid-again.txt
      - name: Build pin tools
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.pin
          load: true
          tags: ipfs-pin
          cache-from: type=gha,scope=pin-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=pin-${{ matrix.arch }}
      - name: Check pin tools offline
        run: |
          docker run --rm --network=none ipfs-pin sh -ec 'ipfs version; aws --version'
          docker run --rm --network=none -v ./package/test/pin.py:/tests/pin.py:ro ipfs-pin python3 /tests/pin.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: |
            dist/
            cid.txt

  reproducibility:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: outputs
      - name: Compare native AMD64 and ARM64 builds
        run: diff -r outputs/dist-amd64 outputs/dist-arm64
